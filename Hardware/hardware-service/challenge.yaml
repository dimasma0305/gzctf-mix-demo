# yaml-language-server: $schema=https://raw.githubusercontent.com/dimasma0305/gzcli/refs/heads/main/internal/template/templates/others/ctf-template/.gzctf/challenge.schema.yaml

name: "Hardware Service"
author: "GZCTF Mix Demo"
description: |
  Embedded / firmware / hardware-adjacent.
  
  Shared service container — same target for every team.
category: "Hardware"
type: "StaticContainer"
flags:
  - "FINDIT{staticcontainer_hardware_static}"
container:
  containerImage: "gzctf/echo-http:test"
  exposePort: 80
  memoryLimit: 128
  cpuCount: 1
  storageLimit: 256
