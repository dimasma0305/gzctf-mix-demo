# yaml-language-server: $schema=https://raw.githubusercontent.com/dimasma0305/gzcli/refs/heads/main/internal/template/templates/others/ctf-template/.gzctf/challenge.schema.yaml

name: "Misc Per-Team Box"
author: "GZCTF Mix Demo"
description: |
  A bit of everything — read the prompt carefully.
  
  Per-team container with a per-team flag.
category: "Misc"
type: "DynamicContainer"
flagTemplate: "FINDIT{dynamiccontainer_misc_[GUID]}"
container:
  containerImage: "gzctf/echo-http:test"
  exposePort: 80
  memoryLimit: 128
  cpuCount: 1
  storageLimit: 256
